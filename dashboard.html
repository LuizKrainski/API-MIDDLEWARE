<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Dashboard</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --card-bg: white;
            --text-color: #333;
            --border-color: #eee;
            --shadow-color: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #f5f5f5;
            --border-color: #404040;
            --shadow-color: rgba(0,0,0,0.3);
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .theme-switch {
            background: none;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .theme-switch:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--shadow-color);
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-online {
            background-color: #4CAF50;
        }

        .status-offline {
            background-color: #f44336;
        }

        .webhook-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .webhook-item {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            transition: border-color 0.3s;
        }

        .webhook-item:last-child {
            border-bottom: none;
        }

        .timestamp {
            color: #666;
            font-size: 0.9em;
        }

        [data-theme="dark"] .timestamp {
            color: #999;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1976D2;
        }

        .refresh-button {
            margin-bottom: 20px;
        }

        pre {
            background-color: var(--bg-color);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>API Dashboard</h1>
        <button class="theme-switch" onclick="toggleTheme()">
            <span id="theme-icon">🌙</span>
            <span id="theme-text">Modo Escuro</span>
        </button>
    </div>
    <button class="refresh-button" onclick="refreshDashboard()">Atualizar Dashboard</button>
    
    <div class="container">
        <div class="card">
            <h2>Status do Sistema</h2>
            <div id="system-status">
                <span class="status-indicator" id="status-dot"></span>
                <span id="status-text">Carregando...</span>
            </div>
            <p>Última atualização: <span id="last-update">-</span></p>
        </div>

        <div class="card">
            <h2>Estatísticas do Banco</h2>
            <div id="db-stats">
                <p>Usuários: <span id="users-count">-</span></p>
                <p>Webhooks: <span id="webhooks-count">-</span></p>
            </div>
        </div>

        <div class="card">
            <h2>Último Webhook</h2>
            <div id="last-webhook">
                <p>Tipo: <span id="last-webhook-type">-</span></p>
                <p>Data: <span id="last-webhook-date">-</span></p>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Webhooks Recentes</h2>
        <div id="webhooks-list" class="webhook-list">
            Carregando webhooks...
        </div>
    </div>

    <script>
        // Função para alternar o tema
        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Modo Escuro';
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Modo Claro';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Carrega o tema salvo
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('theme-icon').textContent = '☀️';
            document.getElementById('theme-text').textContent = 'Modo Claro';
        }

        async function refreshDashboard() {
            try {
                // Atualiza status do sistema
                const statusResponse = await fetch('http://localhost:3000/db-status');
                const statusData = await statusResponse.json();
                
                // Atualiza indicador de status
                const statusDot = document.getElementById('status-dot');
                const statusText = document.getElementById('status-text');
                statusDot.className = `status-indicator ${statusData.status === 'online' ? 'status-online' : 'status-offline'}`;
                statusText.textContent = statusData.status === 'online' ? 'Online' : 'Offline';
                
                // Atualiza timestamp
                document.getElementById('last-update').textContent = new Date(statusData.timestamp).toLocaleString();
                
                // Atualiza estatísticas
                document.getElementById('users-count').textContent = statusData.database.tables.users.total;
                document.getElementById('webhooks-count').textContent = statusData.database.tables.webhooks.total;
                
                // Atualiza último webhook
                const lastWebhook = statusData.database.tables.webhooks.last_received;
                if (lastWebhook) {
                    document.getElementById('last-webhook-type').textContent = lastWebhook.event_type;
                    document.getElementById('last-webhook-date').textContent = new Date(lastWebhook.created_at).toLocaleString();
                } else {
                    document.getElementById('last-webhook-type').textContent = 'Nenhum webhook recebido';
                    document.getElementById('last-webhook-date').textContent = '-';
                }

                // Atualiza lista de webhooks
                const webhooksResponse = await fetch('http://localhost:3000/webhooks');
                const webhooksData = await webhooksResponse.json();
                
                const webhooksList = document.getElementById('webhooks-list');
                webhooksList.innerHTML = webhooksData.length ? webhooksData.map(webhook => `
                    <div class="webhook-item">
                        <strong>${webhook.event_type}</strong>
                        <div class="timestamp">${new Date(webhook.created_at).toLocaleString()}</div>
                        <pre>${JSON.stringify(webhook.payload, null, 2)}</pre>
                    </div>
                `).join('') : '<p>Nenhum webhook recebido</p>';
            } catch (error) {
                console.error('Erro ao atualizar dashboard:', error);
                document.getElementById('status-dot').className = 'status-indicator status-offline';
                document.getElementById('status-text').textContent = 'Erro ao conectar';
            }
        }

        // Atualiza o dashboard a cada 5 segundos
        refreshDashboard();
        setInterval(refreshDashboard, 5000);
    </script>
</body>
</html>
